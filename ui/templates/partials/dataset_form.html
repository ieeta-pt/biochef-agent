<div id="fields-{{ field }}" class="flex flex-wrap items-end gap-3">
  <div class="flex flex-col gap-1">
    <label for="id-{{ field }}" class="text-[13px] font-medium">Dataset id</label>
    <input id="id-{{ field }}" name="dataset_id" class="input mono" value="{{ dataset_id }}" readonly>
  </div>
  <div class="flex flex-col gap-1">
    <label for="type-{{ field }}" class="text-[13px] font-medium">Source type</label>
    <select id="type-{{ field }}" class="input"><option>localpath</option></select>
  </div>
  <div class="flex flex-col gap-1">
    <label for="location-{{ field }}" class="text-[13px] font-medium">Folder under the data root</label>
    <input id="location-{{ field }}" name="location" class="input mono" value="{{ location }}">
  </div>
  <button type="button" class="btn btn-primary" hx-post="/ui/_/datasets/bind" hx-include="#fields-{{ field }}" hx-target="#decision-error" hx-swap="innerHTML">{{ button }}</button>
</div>
