# A local BioChef stack: registry, agent, frontend.
#
# Every port is published on ${BIND_HOST}, which defaults to 127.0.0.1 rather
# than to docker's default of every interface. This stack has no authentication
# anywhere and the agent executes tool binaries pulled from a registry, so a
# short "8000:8000" would put that on whatever network the machine is attached
# to -- and the walkthrough would be telling you not to do the thing this file
# had already done. Set BIND_HOST=0.0.0.0 to reach it from another device, and
# mean it.
#
# The ordering is not cosmetic. The agent builds its ORAS client and logs in at
# import, so it exits rather than retries if the registry is not answering yet;
# depends_on with a healthcheck is what makes `up` deterministic instead of a
# race the developer notices as an agent that "randomly" fails to start.

services:
  registry:
    # The reference implementation, pinned. Anything speaking the OCI
    # distribution API would do; this one needs no configuration to accept an
    # anonymous push, which is what makes a local stack a five-minute exercise.
    image: registry:2.8.3
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      # Its own API, not a port check: a listening socket says the process
      # started, not that it will answer a pull.
      test: ["CMD", "/bin/sh", "-c",
             "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  agent:
    build:
      context: .
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AGENT_PORT:-8000}:8000"
    environment:
      # In-cluster name and port, not the published one. A developer editing
      # AGENT_PORT should not have to know that this is different.
      REGISTRY_URL: registry:5000
      # Plain HTTP, because this registry has no certificate. It is why this
      # file is a development stack and not a deployment.
      REGISTRY_INSECURE: "true"
      ORAS_AUTH_BACKEND: basic
      # Placeholders, and they must not be empty. oras's login() PROMPTS for a
      # username it was not given -- `username = input("Username: ")` -- which
      # in a container with no TTY is an immediate EOFError, so the agent exits
      # before it serves anything. This registry has no authentication and
      # ignores whatever is sent; what matters is that something is.
      REGISTRY_USERNAME: biochef
      REGISTRY_PASSWORD: local
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    # The editor, from its own repository, mounted rather than built into an
    # image. It is a sibling checkout: the walkthrough says to clone it beside
    # this one, and FRONTEND_CONTEXT points elsewhere if it is not.
    #
    # A plain node image and an explicit command, so the editor's repository
    # needs no Dockerfile of its own -- adding one there would make bringing up
    # this stack depend on a change landing in another repository first.
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ${FRONTEND_CONTEXT:-../Biochef}:/app
      # Kept out of the mount. node_modules built inside the container must not
      # be written back over the developer's own, which may have been installed
      # on a different platform.
      - frontend-modules:/app/node_modules
    # The repository's own start script, minus --open: that flag would have the
    # dev server try to launch a browser that is not there. Host and port are
    # left alone because its webpack config already sets host 0.0.0.0 and port
    # 8082, and passing --port on the command line did not win against that.
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npx webpack serve --mode development"
    # Uneven on purpose: 8082 is the editor's own port, and the published side
    # is the round number the walkthrough tells people to open.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:8082"
    # Deliberately no AGENT_URL. The editor hardcodes http://localhost:8000
    # where it would call the agent -- it reads no such variable -- so setting
    # one here would look like configuration that works and would not. Changing
    # AGENT_PORT therefore moves the agent out from under the editor; the
    # walkthrough says so.
    depends_on:
      agent:
        condition: service_healthy

volumes:
  registry-data:
  frontend-modules:
