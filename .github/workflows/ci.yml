name: CI

on:
  push:
    branches: [master]
  pull_request:

# A superseded run tells nobody anything, and these jobs install ~90 pinned
# packages three times over.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The floor. run.sh enforces the same number at runtime, and the two must not
  # drift: this matrix is the only thing that proves the floor is real.
  FLOOR: "3.11"

jobs:
  stylesheet:
    name: stylesheet matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild it with the pinned Tailwind CLI
        run: make css

      - name: The committed file is the one that was just built
        # The agent serves the committed file and never runs the CLI, so a
        # template change that forgot `make css` would ship without its styles.
        run: git diff --exit-code ui/static/app.css

  suite:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, because it is the version most likely to break silently,
        # and the newest, because it is what development happens on. Adding a
        # version here is the same decision as changing the floor in run.sh.
        # 3.11 is the declared floor on this branch. Test it as well as the
        # newer development interpreters so the code and pinned requirements
        # prove the version promised by run.sh and .python-version.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned requirements
        # Not "pip install pytest". Installing exactly what is pinned is what
        # catches a pin that no longer resolves on a supported interpreter --
        # which is how the floor was wrong before anyone noticed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the installed set is self-consistent
        run: pip check

      - name: Every module parses on this interpreter
        # Cheap, and it fails on the version that matters rather than only
        # where a test happens to import the module. A PEP 701 f-string made
        # convert.py unimportable below 3.12 for months without this.
        #
        # -f because compileall SKIPS any file with an up-to-date .pyc, and a
        # skipped file is a pass. A fresh checkout has no __pycache__ so it does
        # not bite here today, but a check whose correctness depends on the tree
        # being clean is one restored cache away from being decorative.
        run: |
          python -m compileall -q -f $(git ls-files '*.py') && echo "all modules compile"

      - name: Run the suite
        # -p no:cacheprovider: a stale .pytest_cache in a restored pip cache
        # must not influence collection.
        # --strict-markers: a typo'd marker is an error, not a silently
        # unregistered one, so a skipif that never fires cannot hide.
        #
        # A tree with no tests/ directory is a real state on this branch -- the
        # suite arrives with a later PR -- and is reported rather than failed.
        # That is NOT the same as a suite that ran and tested nothing, which the
        # next step still rejects. The distinction is the whole point: "there is
        # no suite here yet" is a fact, "the suite passed" when it did not run
        # is a lie.
        run: |
          if [ ! -d tests ]; then
            echo "no test suite in this tree yet" | tee no-suite.marker
            exit 0
          fi
          pytest tests/ -v --strict-markers -p no:cacheprovider \
                 --junitxml=results-${{ matrix.python }}.xml

      - name: Refuse a vacuous pass
        # The failure mode this whole file exists to prevent. A green tick that
        # means "nothing ran" is worse than a red one, because it is believed.
        #
        # Three ways a suite can be green while testing nothing: it collected
        # zero tests; every test was skipped; or a skipif guard silently
        # disabled the ones that matter (snakemake missing, say). All three are
        # errors here.
        if: always()
        run: |
          python - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          if os.path.exists("no-suite.marker"):
              print("no suite in this tree; nothing to be vacuous about")
              sys.exit(0)

          files = glob.glob("results-*.xml")
          if not files:
              sys.exit("no junit report: pytest did not run")

          tree = ET.parse(files[0])
          # `find(...) or root` would be wrong: an Element with no children is
          # falsy, so a <testsuite> containing zero testcases -- exactly the
          # case this guard exists to catch -- would fall through to the root
          # and read the wrong counts.
          found = tree.getroot().find("testsuite")
          suite = tree.getroot() if found is None else found
          total = int(suite.get("tests", 0))
          skipped = int(suite.get("skipped", 0))
          errors = int(suite.get("errors", 0))
          failures = int(suite.get("failures", 0))
          ran = total - skipped

          print(f"collected={total} ran={ran} skipped={skipped} "
                f"failures={failures} errors={errors}")

          if total == 0:
              sys.exit("collected zero tests")
          if ran == 0:
              sys.exit("every collected test was skipped")

          # A skip is a failure here, deliberately. Everything the suite needs
          # is in requirements.txt -- snakemake included -- so a test that
          # skips in CI is one whose guard is wrong, or a dependency that did
          # not install. Both are worth a red tick. The integration tests are
          # guarded on `shutil.which("snakemake")` so they degrade on a
          # developer's machine; that guard must never fire here.
          #
          # If a skip ever becomes legitimate, add its reason to ALLOWED with a
          # comment saying why, so the exception is a decision and not a drift.
          ALLOWED = set()

          unexpected = []
          for case in suite.iter("testcase"):
              skip = case.find("skipped")
              if skip is None:
                  continue
              reason = skip.get("message", "")
              line = f"{case.get('classname')}::{case.get('name')} -- {reason}"
              print(f"  SKIPPED {line}")
              if not any(a in reason for a in ALLOWED):
                  unexpected.append(line)

          if unexpected:
              sys.exit(f"{len(unexpected)} test(s) skipped in CI, where nothing should")
          print("suite is not vacuous")
          PY

      - name: Report what was installed
        # So a failure caused by a transitive dependency moving is diagnosable
        # from the log alone, without re-running anything.
        if: always()
        run: pip list --format=freeze

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-py${{ matrix.python }}
          path: results-${{ matrix.python }}.xml

  runner-parity:
    name: both runners agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install apptainer
        # Pinned, like everything else installed here. Not preinstalled on the
        # runner, and there is no first-party action for it, so this is the
        # published .deb rather than a third-party action nobody has read.
        env:
          APPTAINER_VERSION: "1.3.6"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/apptainer.deb \
            "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends /tmp/apptainer.deb
          apptainer --version

      - name: Check podman
        # Preinstalled on the runner image. The parity check fails without it.
        run: podman --version

      - name: The same workflow under every runner
        # E2's acceptance (#15), run for real rather than asserted about.
        #
        # It is not enough to compare outputs. A container runner that quietly
        # fell back to the host would produce identical outputs and pass, and
        # that is precisely the failure worth catching. So the workflow also
        # records which operating system each step ran on -- the runner and the
        # image must not agree -- whether another run's data on the host was
        # readable, and whether a file placed in the workspace can be executed
        # out of it, which is the only rule shape the emitter produces.
        #
        # The image is not named here on purpose: the check reads
        # runner.CONTAINER_IMAGE, so changing the service default changes what
        # is tested. This comment previously named alpine and went stale the
        # moment the default moved.
        #
        # It also fails, rather than skipping, when apptainer is absent. A check
        # that cannot verify anything must not report success.
        run: |
          python ci/runner_parity.py

  singularity:
    name: singularity, not as root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install SingularityCE
        # The published .deb for Ubuntu 24.04, pinned and checked against the
        # digest GitHub publishes for it. It installs the setuid starter and an
        # AppArmor profile that lets SingularityCE make user namespaces.
        env:
          SINGULARITY_VERSION: "4.6.0"
          SINGULARITY_SHA256: "94971e1f2979d77927cc9a098362ee38aad8dc338cb6da51413d545b1bed15aa"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/singularity.deb \
            "https://github.com/sylabs/singularity/releases/download/v${SINGULARITY_VERSION}/singularity-ce_${SINGULARITY_VERSION}-noble_amd64.deb"
          echo "${SINGULARITY_SHA256}  /tmp/singularity.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends /tmp/singularity.deb
          singularity --version

      - name: With the setuid starter
        run: BIOCHEF_APPTAINER_BINARY="$(command -v singularity)" python ci/singularity_check.py

      - name: Without it, in user namespaces only
        # `allow setuid = no` makes SingularityCE run without the setuid starter,
        # so nothing in the step's start has root at all.
        run: |
          sudo sed -i 's/^allow setuid = yes$/allow setuid = no/' /etc/singularity/singularity.conf
          grep -x 'allow setuid = no' /etc/singularity/singularity.conf
          BIOCHEF_APPTAINER_BINARY="$(command -v singularity)" python ci/singularity_check.py

  podman-rootful:
    name: rootful podman 3.0.1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Rootful podman as Debian 11 ships it
        # The podman some TREs have: 3.0.1, run as root. The agent does not run
        # as root; it reaches it through podman-step-root and one sudo rule.
        # ci/podman-rootful.sh sets that up as the README says, checks that the
        # rule allows nothing else and that the script refuses what it must, and
        # then runs a workflow and checks, from inside the step, the user, the
        # read-only root, the limits, the network and the neighbours.
        #
        # Inside a privileged Debian 11 container, the image pinned by digest,
        # because the runner's own podman is 4.9. Debian 11's packages are now
        # only on archive.debian.org, and the script installs them from there.
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" \
            python:3.13-bullseye@sha256:f58f33e0563f2ba81c7afe6259cd912f0c33413da93c75cc3a70a941c17afa8c \
            bash /src/ci/podman-rootful.sh

  tes:
    name: tes, against a server running as root
    runs-on: ubuntu-24.04
    env:
      # By digest, because the runner refuses anything else. The index digest of
      # debian:bookworm-slim, so it resolves on any architecture.
      BIOCHEF_TES_IMAGE: "debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
      BIOCHEF_TES_AUTH: bearer
      BIOCHEF_TES_ISOLATION: attested
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install the helper, the one sudo rule and a TES server running as root
        # What the README says an operator sets up, by ci/tes-setup.sh. It checks
        # that the rule allows the helper and nothing else, and that the helper
        # refuses a directory outside STAGING_ROOT, a relative one, one a symlink
        # names, one at the wrong depth and an unknown command.
        #
        # The server is tests/tes_support.py, not Funnel: it speaks the same
        # exchange, runs each task in a docker container with no network, and as
        # root it returns files owned by root. That proves the exchange and what the
        # agent does around it, and nothing about any particular server.
        run: |
          docker pull "$BIOCHEF_TES_IMAGE"
          bash ci/tes-setup.sh

      - name: A workflow through TES, as the agent's user
        # The agent is biochefagent, which can sudo the helper and nothing else.
        # From inside the steps: the image they ran in is not the host's, another
        # run's directory and the agent's environment are not there. From the files:
        # the server returned them owned by root, the helper gave them back, and
        # retention can delete them. And a run that times out is cancelled through
        # the server.
        run: |
          sudo -u "$AGENT_USER" -H env \
            "PATH=$PATH" "TES_CHECK_EXPECT_ROOT=1" "BIOCHEF_TES_URL=$BIOCHEF_TES_URL" \
            "BIOCHEF_TES_IMAGE=$BIOCHEF_TES_IMAGE" "BIOCHEF_TES_AUTH=$BIOCHEF_TES_AUTH" \
            "BIOCHEF_TES_TOKEN_FILE=$BIOCHEF_TES_TOKEN_FILE" \
            "BIOCHEF_TES_STAGING=$BIOCHEF_TES_STAGING" "BIOCHEF_TES_HELPER=$BIOCHEF_TES_HELPER" \
            "BIOCHEF_TES_ISOLATION=$BIOCHEF_TES_ISOLATION" \
            python /srv/biochef-agent-src/ci/tes_check.py

      - name: The container of the run that timed out is gone
        run: test -z "$(docker ps --quiet --filter name=tes-)"

  tes-funnel:
    name: tes, against Funnel v0.12.2
    runs-on: ubuntu-24.04
    env:
      # Funnel v0.12.2 has a tag and no release, binary or public image, so it is built
      # here from the commit the tag names. The commit, not the tag, so a moved tag
      # cannot change what is tested.
      FUNNEL_REF: d5f06550076db4a5ca4a77ae81f6a3fda37d7a3d
      BIOCHEF_TES_IMAGE: "debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
      BIOCHEF_TES_AUTH: none
      BIOCHEF_TES_ISOLATION: attested
      TES_SERVER: funnel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: calypr/funnel
          ref: ${{ env.FUNNEL_REF }}
          path: funnel-src

      - uses: actions/setup-go@v5
        with:
          go-version-file: funnel-src/go.mod
          cache-dependency-path: funnel-src/go.sum

      - name: Build Funnel
        run: |
          make -C funnel-src build
          funnel-src/funnel version
          # Out of the checkout, which ci/tes-setup.sh copies for the agent's user.
          mv funnel-src "$RUNNER_TEMP/funnel-src"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Install the helper and the one sudo rule, and start Funnel as root
        # The same setup as the stand-in's job, with Funnel in its place: the helper
        # and the rule are checked the same way, and Funnel is configured as an
        # operator who attests network isolation would configure it (docker run with
        # no network, its own --read-only), allowed to read and write the staging
        # root and nothing else.
        run: |
          docker pull "$BIOCHEF_TES_IMAGE"
          FUNNEL_SRC="$RUNNER_TEMP/funnel-src" bash ci/tes-setup.sh

      - name: A workflow through Funnel, as the agent's user
        # What the stand-in's job checks, against the real server. The three things the
        # runner takes from a TES server and which only Funnel can confirm are in this:
        # a DIRECTORY input and output by file://, the name_prefix filter (the run is
        # cancelled by it, and the check lists by it), and a step that writes, which
        # Funnel can only do in its own copy because it mounts every input read-only.
        run: |
          sudo -u "$AGENT_USER" -H env \
            "PATH=$PATH" "TES_CHECK_EXPECT_ROOT=1" "BIOCHEF_TES_URL=$BIOCHEF_TES_URL" \
            "BIOCHEF_TES_IMAGE=$BIOCHEF_TES_IMAGE" "BIOCHEF_TES_AUTH=$BIOCHEF_TES_AUTH" \
            "BIOCHEF_TES_STAGING=$BIOCHEF_TES_STAGING" "BIOCHEF_TES_HELPER=$BIOCHEF_TES_HELPER" \
            "BIOCHEF_TES_ISOLATION=$BIOCHEF_TES_ISOLATION" \
            python /srv/biochef-agent-src/ci/tes_check.py

      - name: No container of the run that timed out is left
        # Funnel removes a cancelled task's container itself, a moment after the
        # cancel, so this waits for it. What is left after the wait is named.
        run: |
          for _ in $(seq 1 30); do
              [ -z "$(docker ps --quiet)" ] && exit 0
              sleep 1
          done
          docker ps --format 'left: {{.Names}} {{.Image}} {{.Status}}'
          exit 1

      - name: Funnel's log
        if: failure()
        run: sudo cat "${RUNNER_TEMP:-/tmp}/funnel.log" | tail -80 | cut -c1-400

  tes-api:
    name: tes api, in front of rootless podman
    runs-on: ubuntu-24.04
    env:
      BIOCHEF_TESAPI_IMAGE: "debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Check podman
        # Preinstalled on the runner image, as in the parity job.
        run: podman --version

      - name: Tasks sent to the listener
        # The listener is started in the check, on loopback, with the podman runner
        # and a task image by digest. From inside the steps: the image they ran in
        # is not the host's, and the datasets, the agent's environment and the
        # network are not there. From the files: the output is the agent's. From
        # the requests: no token, an unlisted image, a URL that is not file://, a
        # path outside the listed directories, a dataset and an env are refused.
        # From the trail: each event has "source": "tes", and no secret is in it.
        run: |
          podman pull "docker://${BIOCHEF_TESAPI_IMAGE}"
          python ci/tes_api_check.py

  catalogue:
    name: catalogue converts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ieeta-pt/biochef-recipes
          path: .recipes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Convert every operation in the catalogue
        # The check that has repeatedly caught what the unit tests could not:
        # sorting the document's keys reordered arguments for 85 of 176
        # operations, and quoting the empty string added an argument to 100 of
        # them, while every targeted test stayed green.
        #
        # It snapshots the OUTPUT -- a hash of each generated Snakefile -- and
        # not merely whether conversion threw. That distinction is the whole
        # value: the first version of this script checked only for exceptions,
        # and both regressions above were verified to pass straight through it,
        # because neither raises. With hashing, reordering parameters is caught
        # as 85 operations changed and an added empty argument as 127.
        #
        # A PR that deliberately changes emitted output regenerates the baseline
        # and the diff then states exactly which operations changed.
        run: |
          python .github/scripts/catalogue_smoke.py .recipes ci/catalogue-baseline.json
